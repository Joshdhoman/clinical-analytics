[theme]
base = "light"
primaryColor = "#2f6f4e"
backgroundColor = "#fafbf9"
secondaryBackgroundColor = "#eff3ef"
textColor = "#17251e"
font = "sans-serif"
headingFont = "serif"
borderColor = "#dce4dd"
baseRadius = "0.75rem"
buttonRadius = "0.5rem"
showWidgetBorder = true
dataframeHeaderBackgroundColor = "#eff3ef"
chartCategoricalColors = ["#2f6f4e", "#71869b"]

[theme.sidebar]
backgroundColor = "#f0f4ef"
secondaryBackgroundColor = "#ffffff"

[browser]
gatherUsageStats = false
